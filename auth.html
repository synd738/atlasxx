<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Capital - Secure Crypto Investment Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Login/Register Section -->
      <div class="auth-section" id="authSection">
        <div class="auth-card">
          <div class="logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <path
                d="M20 0L40 10V30L20 40L0 30V10L20 0Z"
                fill="currentColor"
                opacity="0.1"
              />
              <path
                d="M20 8L32 14V26L20 32L8 26V14L20 8Z"
                fill="currentColor"
              />
            </svg>
            <h1>Atlas Capital</h1>
          </div>

          <!-- Login Form -->
          <div class="form-container" id="loginForm">
            <h2>Welcome Back</h2>
            <p class="form-subtitle">Sign in to access your investment dashboard</p>

            <form id="loginFormElement">
              <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                  type="email"
                  id="loginEmail"
                  placeholder="Enter email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                  type="password"
                  id="loginPassword"
                  placeholder="Enter your password"
                  required
                />
              </div>

              <div class="error-message" id="loginError"></div>

              <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <p class="form-footer">
              Don't have an account?
              <a href="#" id="showRegister">Sign up</a>
            </p>

            
          </div>

          <!-- Register Form -->
          <div class="form-container hidden" id="registerForm">
            <h2>Create Account</h2>
            <p class="form-subtitle">Start your investment journey today</p>

            <form id="registerFormElement">
              <div class="form-group">
                <label for="registerName">Full Name</label>
                <input
                  type="text"
                  id="registerName"
                  placeholder="Enter fullName"
                  required
                />
              </div>

              <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input
                  type="email"
                  id="registerEmail"
                  placeholder="Enter email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="registerPassword">Password</label>
                <input
                  type="password"
                  id="registerPassword"
                  placeholder="Min. 6 characters"
                  required
                />
              </div>

              <div class="error-message" id="registerError"></div>

              <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <p class="form-footer">
              Already have an account?
              <a href="#" id="showLogin">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>


 




<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="core-utils.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="BackendDatabaseAuthPH.js"></script>
<script src="auth.js"></script>

</body>
</html>

</body>
</html>


</html>  </body>
